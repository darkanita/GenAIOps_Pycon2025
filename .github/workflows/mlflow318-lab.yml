name: MLflow 3.18 lab (quality gate)

# Runs the lab with the simulated agent, in Spanish and English: no API keys needed.
on:
  push:
    paths:
      - 'labs/mlflow_318/**'
      - 'app/i18n.py'
      - '**.md'
      - 'tests/test_docs_parity.py'
      - '.github/workflows/mlflow318-lab.yml'
  pull_request:
    paths:
      - 'labs/mlflow_318/**'
      - 'app/i18n.py'
      - '**.md'
  workflow_dispatch:

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        lang: [es, en]      # the lab works in Spanish and in English
    env:
      APP_LANG: ${{ matrix.lang }}
      MLFLOW_TRACKING_URI: sqlite:///mlflow_ci_${{ matrix.lang }}.db
      MLFLOW_DISABLE_AGENT_HINT: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r labs/mlflow_318/requirements.txt

      - name: v2 must be blocked (better average, worse questions)
        run: |
          if python labs/mlflow_318/step2_compare.py --baseline v1 --candidate v2 --gate; then
            echo "::error::The gate let v2 through, but it has regressions"; exit 1
          fi

      - name: v3 must pass the gate
        run: python labs/mlflow_318/step2_compare.py --baseline v1 --candidate v3 --gate

      - name: Gate in pytest
        run: pytest labs/mlflow_318/test_gate.py -v

      - name: English and Spanish docs have the same structure
        if: matrix.lang == 'en'
        run: pytest tests/test_docs_parity.py -v
